<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archetype harness — agent civilisation</title>
    <style>
      :root {
        --ink: #22262a;
        --muted: #6d757c;
        --panel: rgba(250, 249, 246, 0.93);
        --line: rgba(34, 38, 42, 0.14);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #d9dcdb; }
      body {
        font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
      }
      canvas { display: block; }
      #labels { position: fixed; inset: 0; pointer-events: none; }
      .label {
        position: absolute;
        transform: translate(-50%, 0);
        text-align: center;
        white-space: nowrap;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
      }
      .label b { font-weight: 600; }
      .label span { color: var(--muted); }
      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 268px;
        padding: 14px 16px 16px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(8px);
      }
      #panel h1 { margin: 0 0 2px; font-size: 13px; letter-spacing: 0.01em; }
      #panel p.sub { margin: 0 0 12px; color: var(--muted); font-size: 11px; }
      label.row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; margin: 7px 0; font-size: 11.5px;
      }
      label.row input[type="range"] { flex: 1; }
      label.row output { min-width: 46px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      .seg { display: flex; gap: 4px; margin: 10px 0 4px; flex-wrap: wrap; }
      .seg button {
        flex: 1 1 auto; padding: 5px 8px; font: inherit; font-size: 11px;
        border: 1px solid var(--line); background: transparent; border-radius: 6px;
        cursor: pointer; color: var(--ink);
      }
      .seg button[aria-pressed="true"] { background: var(--ink); color: #f7f6f3; border-color: var(--ink); }
      #stats { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
               color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      #hint { position: fixed; bottom: 14px; left: 16px; color: var(--muted); font-size: 11px; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="labels"></div>
    <div id="panel">
      <h1>Archetype harness</h1>
      <p class="sub">§16.1 — one of each form, no simulation running.</p>

      <div class="seg" id="mode">
        <button data-mode="grid" aria-pressed="true">Vocabulary</button>
        <button data-mode="real" aria-pressed="false">Real stock</button>
      </div>

      <label class="row">Height
        <input id="height" type="range" min="0" max="1" step="0.01" value="0.5" />
        <output id="heightOut"></output>
      </label>
      <label class="row">Year
        <input id="year" type="range" min="1650" max="2045" step="5" value="1909" />
        <output id="yearOut"></output>
      </label>
      <label class="row">Roof evidence
        <select id="roof">
          <option value="slanted">slanted</option>
          <option value="horizontal">horizontal</option>
          <option value="unknown">unknown</option>
        </select>
      </label>

      <div id="stats"></div>
    </div>
    <div id="hint">drag orbit · shift-drag pan · wheel zoom · <a href="/">back to the city</a></div>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
